# yaml-language-server: $schema=https://raw.githubusercontent.com/TheGameratorT/NCPatcher/main/schema/regions.schema.json
#
# The overlays New Super Mario Bros. (NTR-A2DE) has, and how far each may
# grow before it runs into whatever the game placed after it.
#
# This is game knowledge, not project configuration: the same table serves
# every project built against this game. A project points at it with
#
#     targets:
#       arm9:
#         region-catalog: ${env.NSMBREF_ROOT}/overlays9.yaml
#
# and overrides any entry by declaring that region itself. An overlay
# nothing is built into is dropped, so listing them all costs nothing.
version: 1

